# Render Blueprint for Messain
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then on https://dashboard.render.com
# choose "New" -> "Blueprint" and select the repository. The Dockerfile
# builds the frontend and backend, so no build/start commands are needed.
#
# NOTE (free plan): the service sleeps after ~15 minutes without traffic
# (first request then takes up to a minute to wake up), and the filesystem
# is ephemeral -- accounts and messages are reset on every restart/redeploy.

services:
  - type: web
    name: messain
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Keep tokens valid for a week on a public deployment.
      - key: MESSAIN_TOKEN_EXPIRE_DAYS
        value: 7
